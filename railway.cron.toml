# Config for the Telegram cron service (Railway service "primepoint").
#
# WHY THIS FILE EXISTS. Railway's config-as-code beats the dashboard, and the
# repo root holds `railway.toml`, whose startCommand is the web server. Every
# service built from this repo reads that file unless told otherwise — so the
# cron service woke at its scheduled minute, ran migrate + attach_exam_audio +
# gunicorn, and sat there as a second web server instead of posting. It then
# never exited, so the following day's trigger had nothing to fire into.
# (Diagnosed 2026-09-07 from its own logs: "Listening at: http://0.0.0.0:8080".)
#
# The cron service is pointed at THIS file in
#   Railway → service "primepoint" → Settings → Config-as-code → railway.cron.toml
# Never point the `web` service here, and never add a cronSchedule to railway.toml.

[build]
builder = "NIXPACKS"
buildCommand = "python manage.py collectstatic --noinput"

[deploy]
# 22:00 Tashkent. Railway cron is always UTC.
cronSchedule = "0 17 * * *"
startCommand = "python manage.py telegram_daily"
# A cron run must not be resurrected: telegram_daily exits non-zero when a post
# failed, and ON_FAILURE would restart the container in a loop.
restartPolicyType = "NEVER"
